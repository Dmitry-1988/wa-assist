name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Claude Code updates itself without a word, and the isolation of the model
  # runs rests on how it treats its flags. Weekly, so a CLI change is caught
  # even when nothing here was pushed.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    # The browser tests need a real Chromium and are marked `browser`; this
    # job runs everything else, which is the bulk of the suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      # The real-CLI checks (test_prompt_mentions, test_settings_isolation)
      # talk only to a fake API on localhost with a dummy key. Latest CLI on
      # purpose: catching its changes is the point.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run tests
        env:
          WA_REQUIRE_CLAUDE_CLI: "1"
        run: uv run pytest -m "not browser" -q -rs
