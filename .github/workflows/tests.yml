name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The browser tests need a real Chromium and are marked `browser`; this
    # job runs everything else, which is the bulk of the suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -m "not browser" -q
